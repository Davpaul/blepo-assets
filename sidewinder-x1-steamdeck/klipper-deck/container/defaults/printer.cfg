# Artillery Sidewinder X1 - Klipper config
# Board: MKS Gen L style (ATmega2560, RAMPS pinout), TMC2100 drivers, dual Z on Z + E1.
# Values taken from Artillery's stock Marlin firmware (steps/mm, bed size, PID, endstop logic).
# Speeds are deliberately gentle for first tests. Raise max_velocity/max_accel once it all works.
#
# Firmware for the board: run `klipper-deck flash` on the Deck (ATmega2560, 16MHz, serial 250000).

[include mainsail.cfg]

[mcu]
# install.sh / klipper-deck maps the printer's USB port to /dev/printer inside the container
serial: /dev/printer
baud: 250000
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 39.94
endstop_pin: ^!PE5
position_endstop: -2
position_min: -2
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 39.94
endstop_pin: ^!PJ1
position_endstop: -5
position_min: -5
position_max: 310
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8.004
endstop_pin: ^!PD3
position_endstop: 0
position_min: -5
position_max: 400
homing_speed: 10

# Second Z motor, wired to the E1 driver
[stepper_z1]
step_pin: PC1
dir_pin: !PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 8.004

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 7.19
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 14.58
pid_Ki: 1.14
pid_Kd: 46.57
min_temp: 0
max_temp: 260
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_Kp: 244.21
pid_Ki: 45.87
pid_Kd: 325.08
min_temp: 0
max_temp: 110

# Part cooling fan
[fan]
pin: PH6

# Hotend fan: comes on above 50C, like stock
[heater_fan hotend_fan]
pin: PH4
heater: extruder
heater_temp: 50.0

# Home Z in the middle of the bed
[safe_z_home]
home_xy_position: 150, 155
z_hop: 5
z_hop_speed: 10

# Lets the slicer's "exclude object" and Mainsail's object list work
[exclude_object]

# Manual bed levelling helper (stock X1 has no probe).
# Home first, then run BED_SCREWS_ADJUST and use a sheet of paper under the nozzle.
[bed_screws]
screw1: 30, 30
screw1_name: front left
screw2: 270, 30
screw2_name: front right
screw3: 270, 280
screw3_name: back right
screw4: 30, 280
screw4_name: back left

[idle_timeout]
timeout: 1800
