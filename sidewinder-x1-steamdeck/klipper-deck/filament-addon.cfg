#####################################################################
# Filament: Load / Unload buttons + runout sensor (Sidewinder X1)
# Paste this at the END of printer.cfg, but ABOVE the line that
# starts with  #*# <---------------------- SAVE_CONFIG  (if there is one).
#####################################################################

# Mainsail shows LOAD and UNLOAD buttons in the Extruder panel when these exist.
# Default temperature is 200C (PLA). For PETG use:  LOAD_FILAMENT TEMP=235

[gcode_macro LOAD_FILAMENT]
description: Heat the nozzle and feed filament through it
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    {% if printer.extruder.target < temp %}
        M104 S{temp}
    {% endif %}
    M109 S{[printer.extruder.target, temp]|max}
    SAVE_GCODE_STATE NAME=_load
    M83
    G1 E40 F300
    G1 E30 F150
    RESTORE_GCODE_STATE NAME=_load
    RESPOND MSG="Loaded. Plastic should be coming out of the nozzle. Repeat if not."

[gcode_macro UNLOAD_FILAMENT]
description: Heat the nozzle and pull filament back out
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    {% if printer.extruder.target < temp %}
        M104 S{temp}
    {% endif %}
    M109 S{[printer.extruder.target, temp]|max}
    SAVE_GCODE_STATE NAME=_unload
    M83
    G1 E10 F300
    G1 E-90 F1800
    RESTORE_GCODE_STATE NAME=_unload
    RESPOND MSG="Unloaded. Press the extruder lever and pull the filament out."

# ---- Filament runout sensor -------------------------------------------------
# The X1's sensor can be wired to one of these three pins depending on board
# version. All three are listed with pausing OFF so nothing happens by mistake.
# In Mainsail push filament in and out of the sensor and watch which one flips
# between "detected" and "empty". Keep that one, delete the other two, and
# change its pause_on_runout to True.

[filament_switch_sensor runout_test_a]
switch_pin: ^PE4
pause_on_runout: False

[filament_switch_sensor runout_test_b]
switch_pin: ^PG5
pause_on_runout: False

[filament_switch_sensor runout_test_c]
switch_pin: ^PD2
pause_on_runout: False
